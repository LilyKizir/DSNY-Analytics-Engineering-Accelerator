# =====================================================================
# dbt Project Configuration: EIA Energy Analytics Engineering
# =====================================================================
# Transforms raw EIA API JSON payloads in Snowflake into a Kimball-style
# star schema and BI-ready gold data marts.

name: 'transformer'
version: '1.0.0'
config-version: 2

# Target connection profile defined in profiles.yml
profile: 'transformer'

# Directory Pathing
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Directories removed on `dbt clean`
clean-targets:
  - "target"
  - "dbt_packages"

# =====================================================================
# Model Materialization & Schema Layering
# =====================================================================
models:
  transformer:
    # -----------------------------------------------------------------
    # Layer 1: Staging (Bronze)
    # Flattens raw JSON VARIANT payloads, cleans column names, and casts
    # basic data types without modifying source grain.
    # -----------------------------------------------------------------
    staging:
      +materialized: view
      +schema: STAGE

    # -----------------------------------------------------------------
    # Layer 2: Intermediate (Silver)
    # Reshapes staging data into normalized Kimball Star Schema entities 
    # (fact_* and dim_*) to establish core data integrity.
    # -----------------------------------------------------------------
    intermediate:
      +materialized: view
      +schema: INTERMEDIATE

    # -----------------------------------------------------------------
    # Layer 3: Marts (Gold)
    # Joins dimensions and facts to apply business logic, calculate KPIs,
    # and aggregate metrics into performance-optimized reporting tables.
    # -----------------------------------------------------------------
    marts:
      +materialized: table
      +schema: MART
