version: 2

models:
  - name: stg_regional_operating_metrics
    description: >
      Staging model for regional operating metrics. Flattens the raw JSON array 
      and standardizes column names and data types.
    columns:
      - name: rom_id
        description: "Primary key. Surrogate key generated by hashing operating_timestamp_utc, region_code, and metric_type."
        tests:
          - unique
          - not_null
      - name: period
        description: "The UTC timestamp of the operating hour."
        tests:
          - not_null
      - name: ba_code
        description: "Short code for the Balancing Authority (e.g., 'TEX')."
        tests:
          - not_null
      - name: ba_name
        description: "Full name of the region."
      - name: type_code
        description: "The metric code (e.g., 'D', 'NG', 'TI')."
        tests:
          - not_null
      - name: type_name
        description: "The metric full name (e.g., 'Demand', 'Net Generation', 'Total Interchange')."
        tests:
          - not_null
      - name: value_mwh
        description: "The numeric value for the specific metric."
      - name: value_units
        description: "Unit of measurement. Expected to be 'megawatthours'."

  - name: stg_generation_energy_source
    description: >
      Staging model for generation by fuel type. Flattens the raw JSON array 
      and casts values for downstream aggregations.
    columns:
      - name: ges_id
        description: "Primary key. Surrogate key generated by hashing operating_timestamp_utc, region_code, and metric_type."
        tests:
          - unique
          - not_null
      - name: period
        description: "The UTC timestamp of the operating hour."
        tests:
          - not_null
      - name: ba_code
        description: "Short code for the Balancing Authority (e.g., 'TEX')."
        tests:
          - not_null
      - name: ba_name
        description: "Full name of the region."
      - name: fuel_code
        description: "The fuel code (e.g., 'NG', 'SUN', 'WAT')."
        tests:
          - not_null
      - name: fuel_name
        description: "The fuel full name (e.g., 'Natural Gas', 'Solar', 'Hydro')."
        tests:
          - not_null
      - name: value_mwh
        description: "The numeric value for the specific metric."
      - name: value_units
        description: "Unit of measurement. Expected to be 'megawatthours'."

  - name: stg_subregional_demand
    description: >
      Staging model for sub-regional utility demand. Flattens JSON and maps 
      sub-regions to their parent Balancing Authorities.
    columns:
      - name: srd_id
        description: "Primary key. Surrogate key generated by hashing operating_timestamp_utc, region_code, and metric_type."
        tests:
          - unique
          - not_null
      - name: period
        description: "The UTC timestamp of the operating hour."
        tests:
          - not_null
      - name: ba_code
        description: "Short code for the Balancing Authority (e.g., 'TEX')."
        tests:
          - not_null
      - name: ba_name
        description: "Full name of the region."
      - name: sub_ba_code
        description: "Short code for the Balancing Authority subregion."
        tests:
          - not_null
      - name: sub_ba_name
        description: "Full name of the BA subregion."
      - name: value_mwh
        description: "Actual electricity demand in megawatt-hours."
      - name: value_units
        description: "Unit of measurement. Expected to be 'megawatthours'."


  - name: stg_balancing_authority_interchange
    description: >
      Staging model for grid interchange data. Flattens JSON to expose 
      directional power flows between interconnected grids.
    columns:
      - name: bai_id
        description: "Primary key. Surrogate key generated by hashing operating_timestamp_utc, from_ba_code, and to_ba_code."
        tests:
          - unique
          - not_null
      - name: period
        description: "The UTC timestamp of the operating hour."
        tests:
          - not_null
      - name: fromba_code
        description: "The code of the Balancing Authority/grid exporting the power."
        tests:
          - not_null
      - name: fromba_name
        description: "Full name of the Balancing Authority/grid."
      - name: toba_code
        description: "The code of the Balancing Authority/grid importing the power."
        tests:
          - not_null
      - name: toba_name
        description: "Full name of the Balancing Authority/grid."
      - name: value_mwh
        description: "The volume of electricity transferred."
      - name: value_units
        description: "Unit of measurement. Expected to be 'megawatthours'."