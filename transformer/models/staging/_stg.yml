version: 2

models:
  - name: stg_regional_operating_metrics
    description: >
      Staging model for EIA regional operating metrics (Demand, Forecasted Demand, 
      Net Generation, Total Interchange). Flattens raw JSON payloads from 
      `raw_regional_operating_metrics` using LATERAL FLATTEN, casts data types, 
      and extracts post_date and post_time attributes.
    columns:
      - name: rom_id
        description: "Primary key. Surrogate key generated by hashing raw JSON fields period, respondent, and type."
        tests:
          - unique
          - not_null

      - name: post_date
        description: "The operating date extracted from period using TO_DATE (YYYY-MM-DD)."
        tests:
          - not_null

      - name: post_time
        description: "The operating hour extracted from period using TO_TIME (HH:MI:SS)."
        tests:
          - not_null

      - name: ba_code
        description: "Short code/identifier for the Balancing Authority (e.g., 'TEX', 'CISO')."
        tests:
          - not_null

      - name: ba_name
        description: "Full descriptive name of the Balancing Authority."

      - name: type_code
        description: "Standardized metric type code (e.g., 'D' for Demand, 'NG' for Net Generation, 'TI' for Total Interchange, 'DF' for Demand Forecast)."
        tests:
          - not_null

      - name: type_name
        description: "Descriptive metric type name (e.g., 'Demand', 'Net Generation', 'Day-Ahead Demand Forecast')."
        tests:
          - not_null

      - name: value_mwh
        description: "Operating metric value in Megawatt-hours (MWh)."

      - name: value_units
        description: "Unit of measurement string returned by API (e.g., 'megawatthours')."

  - name: stg_generation_energy_source
    description: >
      Staging model for EIA electricity generation by energy source (fuel type). 
      Flattens raw JSON payloads from `raw_generation_energy_source` using LATERAL FLATTEN, 
      casts data types, and extracts post_date and post_time attributes.
    columns:
      - name: ges_id
        description: "Primary key. Surrogate key generated by hashing raw JSON fields period, respondent, and fueltype."
        tests:
          - unique
          - not_null

      - name: post_date
        description: "The operating date extracted from period using TO_DATE (YYYY-MM-DD)."
        tests:
          - not_null

      - name: post_time
        description: "The operating hour extracted from period using TO_TIME (HH:MI:SS)."
        tests:
          - not_null

      - name: ba_code
        description: "Short code/identifier for the Balancing Authority (e.g., 'TEX', 'CISO')."
        tests:
          - not_null

      - name: ba_name
        description: "Full descriptive name of the Balancing Authority."

      - name: fuel_code
        description: "Standardized EIA fuel type code (e.g., 'NG', 'SUN', 'COL', 'NUC')."
        tests:
          - not_null

      - name: fuel_name
        description: "Descriptive fuel type name (e.g., 'Natural Gas', 'Solar', 'Coal')."
        tests:
          - not_null

      - name: value_mwh
        description: "Net electricity generation volume in Megawatt-hours (MWh)."

      - name: value_units
        description: "Unit of measurement string returned by API (e.g., 'megawatthours')."

  - name: stg_subregional_demand
    description: >
      Staging model for sub-regional electricity demand nested within larger 
      Balancing Authorities. Flattens raw JSON payloads from `raw_subregional_demand` 
      using LATERAL FLATTEN, casts data types, and extracts post_date and post_time attributes.
    columns:
      - name: srd_id
        description: "Primary key. Surrogate key generated by hashing raw JSON fields period, subba, and parent."
        tests:
          - unique
          - not_null

      - name: post_date
        description: "The operating date extracted from period using TO_DATE (YYYY-MM-DD)."
        tests:
          - not_null

      - name: post_time
        description: "The operating hour extracted from period using TO_TIME (HH:MI:SS)."
        tests:
          - not_null

      - name: ba_code
        description: "Short code/identifier for the parent Balancing Authority (e.g., 'PJM', 'CISO')."
        tests:
          - not_null

      - name: ba_name
        description: "Full descriptive name of the parent Balancing Authority."

      - name: sub_ba_code
        description: "Short code/identifier for the granular sub-balancing authority or sub-zone."
        tests:
          - not_null

      - name: sub_ba_name
        description: "Full descriptive name of the sub-balancing authority zone."

      - name: value_mwh
        description: "Actual electricity demand in Megawatt-hours (MWh)."

      - name: value_units
        description: "Unit of measurement string returned by API (e.g., 'megawatthours')."

  - name: stg_balancing_authority_interchange
    description: >
      Staging model for EIA grid interchange data. Flattens raw JSON payloads 
      from `raw_balancing_authority_interchange` using LATERAL FLATTEN, casts 
      data types, and extracts post_date and post_time attributes.
    columns:
      - name: bai_id
        description: "Primary key. Surrogate key generated by hashing raw JSON fields period, fromba, and toba."
        tests:
          - unique
          - not_null

      - name: post_date
        description: "The operating date extracted from period using TO_DATE (YYYY-MM-DD)."
        tests:
          - not_null

      - name: post_time
        description: "The operating hour extracted from period using TO_TIME (HH:MI:SS)."
        tests:
          - not_null

      - name: fromba_code
        description: "Unique identifier/code of the exporting Balancing Authority."
        tests:
          - not_null

      - name: fromba_name
        description: "Full descriptive name of the exporting Balancing Authority."

      - name: toba_code
        description: "Unique identifier/code of the importing Balancing Authority."
        tests:
          - not_null

      - name: toba_name
        description: "Full descriptive name of the importing Balancing Authority."

      - name: value_mwh
        description: "Net electricity volume transferred in Megawatt-hours (MWh)."

      - name: value_units
        description: "Unit of measurement string returned by API (e.g., 'megawatthours')."