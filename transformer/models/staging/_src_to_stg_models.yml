version: 2
sources:
    #custom schema path alias for Jinja
  - name: eia_energy
    database: TIL_DATA_ENGINEERING
    schema: AEA_LK_RAW
    tables:
    # table name must match as in snowflake
      - name: raw_regional_operating_metrics # name of table in dbt flowchart comes from [the_file_name].sql
        identifier: raw_regional_operating_metrics

      - name: raw_generation_energy_source # name of table in dbt flowchart comes from [the_file_name].sql
        identifier: raw_generation_energy_source

      - name: raw_subregional_demand # name of table in dbt flowchart comes from [the_file_name].sql
        identifier: raw_subregional_demand

      - name: raw_balancing_authority_interchange # name of table in dbt flowchart comes from [the_file_name].sql
        identifier: raw_balancing_authority_interchange