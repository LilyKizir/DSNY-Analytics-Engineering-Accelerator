name: Daily Snowflake Ingestion

on:
  workflow_dispatch:

jobs:
  run-workflow:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests snowflake-connector-python python-dotenv cryptography

      - name: Run ingestion script
        env:
         # Secure authentication credentials
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          SNOWFLAKE_USERNAME: ${{ secrets.SNOWFLAKE_USERNAME }}
          SNOWFLAKE_PAT: ${{ secrets.SNOWFLAKE_PAT }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          # Explicit static configuration
          SNOWFLAKE_WAREHOUSE: "DATASCHOOL_WH"
          SNOWFLAKE_DATABASE: "TIL_DATA_ENGINEERING"
          SNOWFLAKE_SCHEMA: "AEA_LK_RAW"
        run: python extract-loader/eia_hourly_ingest.py --mode auto
